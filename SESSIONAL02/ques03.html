<!DOCTYPE html>
<html>

</head>
<body>

<header class="bg-primary text-white text-center p-3">

</header>

<!-- Content Section -->
<div class="container my-4">

        <div class="col-lg-4 col-md-6 col-sm-12 bg-light p-3 border">Column 1</div>
        <div class="col-lg-4 col-md-6 col-sm-12 bg-light p-3 border">Column 2</div>
        <div class="col-lg-4 col-md-6 col-sm-12 bg-light p-3 border">Column 3</div>
    </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-2 fixed-bottom">
    © 2026 My Website
</footer>

</body>
</html>
