<!DOCTYPE html>
<html>
<head>
    <title>Text Styling</title>
    <style>
     .heading {
    font-family: 'Arial', sans-serif;
    text-align: center;
}

.content {
    font-family: 'Times New Roman', serif;
    line-height: 1.8;
    text-align: justify;
}

    </style>
</head>
<body>

<h1 class="heading">Web Technologies</h1>

<p class="content">
    This paragraph demonstrates <b>bold</b>, <i>italic</i>, and 
    <u>underlined</u> text with proper alignment and line spacing.
</p>

</body>
</html>
