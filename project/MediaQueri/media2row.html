<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .containar{
            border: 12px solid black;
            background-color: rgba(241, 18, 18, 0.904);
            display:flex;
            flex-direction: row;
            width: 450px;
           margin: 2px;
           padding: 10px;
        

        }
        p{
              border: 1px solid black 
        }
        #boxleft{
            border: 1px solid rgb(102, 19, 255); 
            background-color: rgb(182, 231, 24);
            color: white;
            width:47%;
            margin: 2px;
           padding: 10px;
           flex-direction: column;
             }
        #boxright{
            border: 2px solid black;
            background-color: rgb(176, 164, 24);
            color: white;
             width:47%;
             margin: 2px;
           padding: 10px;
        }
        img{
            height: 200px;
            width: 200px;
        }
        @media(max-width:640px){
            .containar{
                flex-direction:column;
            }
        }
    </style>
</head>
<body>
    <div class="containar">
        <div id="boxleft">
            <p> box1</p>
            <p>box2</p>
        </div>
        <div id="boxright">
            <img src="aman.jpg" alt="image">
        </div>
    </div>
</body>
</html>
