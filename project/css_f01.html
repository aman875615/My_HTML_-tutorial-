<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        button {
            background-color: green;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            font-size: 30px;
        }
        p{
            color: purple;
            font-size: 18px;
            margin: 10px 0;

        }
    </style>
</head>
<body>
    <h1 style="color: blue; background-color: yellow;">this is css class</h1>
    <button>click me</button>
    <button style="background-color: red; color: green;">Click me</button>
    <button>puggiboy </button>
    <p>This is a paragraph styled with CSS.</p>
</body>
</html>
