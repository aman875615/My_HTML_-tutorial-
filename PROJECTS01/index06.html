<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StreamX</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body{
    background:#000;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

/* NAVBAR */
.navbar{
    background:rgba(0,0,0,0.9);
}
.navbar-brand{
    font-size:26px;
    font-weight:bold;
    color:#e50914 !important;
}

/* HERO */
.hero{
    height:90vh;
    background:linear-gradient(to top,#000,transparent),
    url("https://source.unsplash.com/1600x900/?movie") center/cover;
    display:flex;
    align-items:center;
}
.hero-content{
    max-width:600px;
}
.hero h1{
    font-size:3.5rem;
}
.hero p{
    font-size:1.2rem;
}

/* SLIDER */
.slider{
    display:flex;
    overflow-x:auto;
    gap:15px;
    padding-bottom:10px;
}
.slider::-webkit-scrollbar{
    display:none;
}
.card-movie{
    min-width:220px;
    background:#111;
    border:none;
    transition:.4s;
}
.card-movie img{
    height:320px;
    object-fit:cover;
}
.card-movie:hover{
    transform:scale(1.08);
    z-index:10;
}

/* FOOTER */
footer{
    background:#111;
    padding:30px 0;
    margin-top:60px;
}
footer a{
    color:#aaa;
    text-decoration:none;
    margin-right:15px;
}
footer a:hover{
    color:#fff;
}
</style>
</head>

<body>

<!-- 🔴 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">StreamX</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Movies</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Series</a></li>
      <li class="nav-item"><a class="nav-link" href="#">My List</a></li>
    </ul>
  </div>
</nav>

<!-- 🔴 HERO -->
<section class="hero">
  <div class="container hero-content">
    <h1>Unlimited Movies & Shows</h1>
    <p>Watch anywhere. Cancel anytime.</p>
    <button class="btn btn-danger btn-lg me-2">
      <i class="fas fa-play"></i> Play
    </button>
    <button class="btn btn-outline-light btn-lg">
      <i class="fas fa-info-circle"></i> More Info
    </button>
  </div>
</section>

<!-- 🔴 MOVIE SECTIONS -->
<div class="container-fluid px-4 mt-4">

  <h4 class="mb-3">🔥 Trending Now</h4>
  <div class="slider">
    <div class="card card-movie">
      <img src="https://source.unsplash.com/300x450/?action,movie">
    </div>
    <div class="card card-movie">
      <img src="https://source.unsplash.com/300x450/?thriller,movie">
    </div>
    <div class="card card-movie">
      <img src="https://source.unsplash.com/300x450/?drama,movie">
    </div>
    <div class="card card-movie">
      <img src="https://source.unsplash.com/300x450/?sci-fi,movie">
    </div>
  </div>

  <h4 class="mt-4 mb-3">⭐ Top Rated</h4>
  <div class="slider">
    <div class="card card-movie">
      <img src="https://source.unsplash.com/300x450/?cinema">
    </div>
    <div class="card card-movie">
      <img src="https://source.unsplash.com/300x450/?film">
    </div>
    <div class="card card-movie">
      <img src="https://source.unsplash.com/300x450/?webseries">
    </div>
    <div class="card card-movie">
      <img src="https://source.unsplash.com/300x450/?hollywood">
    </div>
  </div>

</div>

<!-- 🔴 FOOTER -->
<footer>
  <div class="container">
    <p class="text-muted">© 2026 StreamX</p>
    <a href="#">FAQ</a>
    <a href="#">Help Center</a>
    <a href="#">Privacy</a>
    <a href="#">Terms</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
