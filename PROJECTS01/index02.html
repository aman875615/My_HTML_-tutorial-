<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bootstrap Sidebar</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* Sidebar styling */
#sidebar {
    width: 250px;
    height: 100vh;
    position: fixed;
    left: -250px;
    top: 0;
    background: #212529;
    transition: 0.3s;
    padding-top: 60px;
}

#sidebar.active {
    left: 0;
}

#sidebar a {
    color: white;
    padding: 15px;
    display: block;
    text-decoration: none;
}

#sidebar a:hover {
    background: #495057;
}

/* Content */
#content {
    padding: 20px;
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <button class="btn btn-outline-light" onclick="toggleSidebar()">☰</button>
    <span class="navbar-brand ms-3">My Website</span>
  </div>
</nav>

<!-- Sidebar -->
<div id="sidebar">
  <a href="#">🏠 Home</a>
  <a href="#">📄 About</a>
  <a href="#">📞 Contact</a>
  <a href="#">⚙️ Settings</a>
</div>

<!-- Main Content -->
<div id="content">
  <h2>Main Content Area</h2>
  <p>Yahan tumhara page ka main content hoga.</p>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
}
</script>

</body>
</html>
