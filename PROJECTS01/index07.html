<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEOX • Stream Platform</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{
  --bg:#0b0b0b;
  --card:#141414;
  --text:#e5e5e5;
  --accent:#e50914;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui, sans-serif;
  overflow-x:hidden;
}
.navbar{
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(10px);
}
.hero{
  height:95vh;
  background:
  linear-gradient(to top,#0b0b0b,transparent),
  url("https://source.unsplash.com/1800x1000/?cinema,screen") center/cover;
  display:flex;
  align-items:end;
}
.hero-content{
  max-width:700px;
  padding:60px;
}
.hero h1{
  font-size:4rem;
  font-weight:800;
}
.section{
  padding:20px 40px;
}
.row-slider{
  display:flex;
  gap:15px;
  overflow-x:auto;
}
.row-slider::-webkit-scrollbar{display:none;}
.poster{
  min-width:230px;
  height:330px;
  background:var(--card);
  border-radius:8px;
  overflow:hidden;
  position:relative;
  transition:.4s;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.poster:hover{
  transform:scale(1.15);
  z-index:20;
}
.poster .overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,#000,transparent);
  opacity:0;
  transition:.3s;
}
.poster:hover .overlay{
  opacity:1;
}
.overlay-content{
  position:absolute;
  bottom:10px;
  left:10px;
}
.badge-ai{
  background:var(--accent);
}
footer{
  background:#000;
  padding:40px;
  color:#777;
}
</style>
</head>

<body>

<!-- 🔴 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top px-4">
  <a class="navbar-brand fw-bold text-danger" href="#">NEOX</a>
  <ul class="navbar-nav ms-auto align-items-center">
    <li class="nav-item me-3"><i class="fas fa-search"></i></li>
    <li class="nav-item me-3"><i class="fas fa-bell"></i></li>
    <li class="nav-item">
      <img src="https://source.unsplash.com/40x40/?face" class="rounded-circle">
    </li>
  </ul>
</nav>

<!-- 🔴 HERO -->
<section class="hero">
  <div class="hero-content">
    <span class="badge badge-ai mb-2">AI RECOMMENDED</span>
    <h1>Future of Streaming</h1>
    <p class="lead">Personalized. Powerful. Premium Experience.</p>
    <button class="btn btn-danger btn-lg me-2">
      <i class="fas fa-play"></i> Watch
    </button>
    <button class="btn btn-outline-light btn-lg">
      <i class="fas fa-plus"></i> My List
    </button>
  </div>
</section>

<!-- 🔴 CONTENT SECTIONS -->
<div class="section">
  <h4 class="mb-3">Because you watched Sci-Fi</h4>
  <div class="row-slider">
    <div class="poster">
      <img src="https://source.unsplash.com/400x600/?sci-fi,movie">
      <div class="overlay">
        <div class="overlay-content">
          <button class="btn btn-sm btn-danger">Play</button>
        </div>
      </div>
    </div>
    <div class="poster">
      <img src="https://source.unsplash.com/400x600/?space,film">
      <div class="overlay"></div>
    </div>
    <div class="poster">
      <img src="https://source.unsplash.com/400x600/?robot,cinema">
      <div class="overlay"></div>
    </div>
    <div class="poster">
      <img src="https://source.unsplash.com/400x600/?future,movie">
      <div class="overlay"></div>
    </div>
  </div>
</div>

<div class="section">
  <h4 class="mb-3">Top Picks For You</h4>
  <div class="row-slider">
    <div class="poster"><img src="https://source.unsplash.com/400x600/?thriller"></div>
    <div class="poster"><img src="https://source.unsplash.com/400x600/?drama"></div>
    <div class="poster"><img src="https://source.unsplash.com/400x600/?action"></div>
    <div class="poster"><img src="https://source.unsplash.com/400x600/?cinema"></div>
  </div>
</div>

<!-- 🔴 FOOTER -->
<footer>
  <div class="container">
    <p>© 2026 NEOX Streaming Platform</p>
    <small>Enterprise-grade UI • Built for scale</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
